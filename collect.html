<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>맛집 담기 — 믿먹</title>
<meta name="description" content="실제 맛집을 검색해서 나만의 리스트에 담아보세요.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/collect.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">믿먹</a>
    <div class="header-right">
      <nav class="site-nav">
        <a href="index.html#demo">데모</a>
        <a href="index.html#roadmap">로드맵</a>
        <a href="index.html#cta">소식받기</a>
      </nav>
      <div class="auth-widget" id="auth-widget">
        <button class="auth-login-button" id="auth-login-button" type="button">로그인</button>
        <div class="auth-status" id="auth-status-group" hidden>
          <span id="auth-status"></span>
          <button class="auth-logout-button" id="auth-logout-button" type="button">로그아웃</button>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="collect-page">

  <section class="collect-search">
    <p class="eyebrow">맛집 담기</p>
    <h1>진짜 맛집을 찾아 담아두세요</h1>
    <p class="section-desc">카카오 로컬에서 실제 가게를 검색하고, 마음에 드는 곳을 리스트에 모아둘 수 있어요.</p>

    <form class="collect-search__form" id="collect-form" role="search">
      <input
        type="search"
        class="collect-search__input"
        id="collect-input"
        name="keyword"
        placeholder="지역, 음식 이름으로 검색 (예: 성수 파스타)"
        aria-label="맛집 검색어">
      <button type="submit" class="collect-search__submit">검색</button>
    </form>

    <div class="collect-categories" id="collect-categories" role="group" aria-label="카테고리 필터"></div>
  </section>

  <p class="collect-status" id="collect-status" role="status" aria-live="polite" hidden></p>

  <div class="collect-results" id="collect-results"></div>

  <button type="button" class="collect-more" id="collect-more" hidden>더보기</button>

  <section class="collect-saved">
    <h2>담은 맛집 <span class="collect-saved__count" id="collect-saved-count">0</span></h2>
    <div class="collect-saved__list" id="collect-saved-list"></div>
  </section>

</main>

<div class="collect-detail-overlay" id="collect-detail-overlay" hidden>
  <div class="collect-detail-card" role="dialog" aria-modal="true" aria-labelledby="collect-detail-name">
    <button class="collect-detail-close" id="collect-detail-close" aria-label="닫기">×</button>
    <div class="collect-detail-body" id="collect-detail-body"></div>
  </div>
</div>

<div class="auth-overlay" id="auth-overlay" hidden>
  <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-modal-title">
    <button class="auth-close" id="auth-close" aria-label="닫기">×</button>
    <h3 id="auth-modal-title">로그인</h3>
    <form class="auth-form" id="auth-form">
      <input type="email" id="auth-email" placeholder="이메일" autocomplete="email" required>
      <input type="password" id="auth-password" placeholder="비밀번호" autocomplete="current-password" required>
      <p class="auth-error" id="auth-error" hidden></p>
      <div class="auth-form__actions">
        <button type="submit" class="auth-submit" id="auth-signin-button">로그인</button>
        <button type="button" class="auth-submit auth-submit--secondary" id="auth-signup-button">회원가입</button>
      </div>
    </form>
  </div>
</div>

<footer class="site-footer">
  <div class="container footer-inner">
    <span class="logo logo-small">믿먹</span>
    <p>&copy; 2026 믿먹. 믿고 먹는 맛집.</p>
  </div>
</footer>

<!-- 로드 순서 중요: supabase-js/wordcloud2.js(외부 라이브러리) → supabase-client/auth(로그인) →
     kakao-local/google-reviews/gemini-analyze(API 프록시 호출) → collect(화면). 번들러 없이 전역으로 주고받는다. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.3/src/wordcloud2.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/kakao-local.js"></script>
<script src="js/google-reviews.js"></script>
<script src="js/gemini-analyze.js"></script>
<script src="js/collect.js"></script>
</body>
</html>
